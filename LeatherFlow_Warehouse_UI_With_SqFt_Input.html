<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeatherFlow Warehouse</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#f3f6fa;color:#1d2b3d}.layout{display:flex;min-height:100vh}.side{width:230px;background:#15345f;color:#fff;padding:20px 14px;flex-shrink:0}.logo{font-size:20px;font-weight:bold;padding:4px 8px 22px}.nav button{display:block;width:100%;text-align:left;padding:13px 12px;border:0;border-radius:7px;background:transparent;color:#dce8f8;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#2a527f;color:white}main{flex:1;min-width:0}.top{height:62px;background:#fff;border-bottom:1px solid #dfe6ef;padding:20px 26px;color:#65758a}.content{padding:25px;max-width:1300px;margin:auto}h1{font-size:24px;margin:0 0 6px}p.sub{color:#69798e;margin:0 0 20px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.kpi,.panel{background:white;border:1px solid #e0e7ef;border-radius:10px;padding:16px}.kpi small{color:#708097}.kpi strong{display:block;font-size:24px;margin-top:7px}.panel{margin-bottom:16px}.panel h2{font-size:16px;margin:0 0 14px}.form{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:12px}.field label{display:block;font-size:12px;color:#687990;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #d9e2ed;border-radius:7px;background:#fff}.btn{padding:10px 14px;border:1px solid #d6e0eb;border-radius:7px;background:#fff;font-weight:bold;cursor:pointer;margin:12px 7px 0 0}.primary{background:#2868ad;border-color:#2868ad;color:white}.success{background:#16845b;border-color:#16845b;color:white}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf1f5;font-size:12px}th{color:#738197;font-size:10px;text-transform:uppercase}.muted{color:#6c7b8f;font-size:12px}.pill{padding:4px 8px;border-radius:20px;background:#e8f1fc;color:#245f9c;font-size:11px}.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;margin-top:15px}.qr{border:1px solid #e1e7ef;border-radius:8px;text-align:center;padding:10px}.qr svg{width:65px;height:65px}.qr b{display:block;font:11px monospace;margin-top:5px}.toast{position:fixed;bottom:20px;right:20px;background:#17375f;color:white;padding:12px 16px;border-radius:8px;display:none}
@media(max-width:760px){.layout{display:block}.side{width:100%;padding:10px}.logo{padding:4px 8px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.content{padding:15px}.kpis{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}
</style></head><body><div class="layout">
<aside class="side"><div class="logo">LeatherFlow</div><nav class="nav">
<button class="active" data-page="qr">01 · QR generation</button><button data-page="grade">02 · Inspection & grade</button><button data-page="putaway">03 · Put-away</button><button data-page="dispatch">04 · Dispatch / pick list</button><button data-page="picking">05 · Picking & confirm</button>
</nav></aside>
<main><div class="top">Leather Warehouse / Operations</div><div class="content">
<h1 id="title">Leather QR generation</h1><p class="sub" id="desc">Select a receipt lot and generate a unique QR code for every leather piece received.</p>
<div class="kpis"><div class="kpi"><small>Receipt lots available</small><strong id="lotsCount">3</strong></div><div class="kpi"><small>QR-tagged leathers</small><strong id="qrCount">0</strong></div><div class="kpi"><small>Awaiting put-away</small><strong id="putCount">0</strong></div><div class="kpi"><small>Open pick lists</small><strong id="pickCount">0</strong></div></div>
<section class="panel" id="workspace"></section>
</div></main></div><div class="toast" id="toast"></div>
<script>
(function(){
const lots=[{id:"GRN-26041",supplier:"ABC Leather Co.",article:"Sheep Nappa - Black",date:"22-Nov-2026",qty:48,done:false},{id:"GRN-26042",supplier:"Sana Tannery",article:"Goat Suede - Tan",date:"22-Nov-2026",qty:36,done:false},{id:"GRN-26039",supplier:"Metro Leathers",article:"Cow Crust - Brown",date:"21-Nov-2026",qty:36,done:false}];
const grades=["A - First quality","B - Second quality","C - Third quality","D - Reject"];
let leather=[],picklists=[],page="qr",lotId=lots[0].id,selectedPick="";
const $=id=>document.getElementById(id);
function notify(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2300)}
function qrSvg(seed){let bits="";let n=seed.split("").reduce((a,c)=>a+c.charCodeAt(0),0);for(let y=0;y<21;y++)for(let x=0;x<21;x++){let v=((x*17+y*31+n*7)%11)<5;if((x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13))v=(x%14===0||x%14===6||y%14===0||y%14===6||(x%14>=2&&x%14<=4&&y%14>=2&&y%14<=4));if(v)bits+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="0 0 21 21"><rect width="21" height="21" fill="white"/><g fill="black">${bits}</g></svg>`}
function stats(){$("lotsCount").textContent=lots.filter(x=>!x.done).length;$("qrCount").textContent=leather.length;$("putCount").textContent=leather.filter(x=>x.grade&&x.grade!=="D"&&!x.location).length;$("pickCount").textContent=picklists.filter(x=>!x.done).length}
function render(){
document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
const names={qr:["Leather QR generation","Select a receipt lot and generate a unique QR code for every leather piece received."],grade:["Inspection & grade mapping","Select a grade from master and scan leather QR codes."],putaway:["Put-away process","Scan each graded leather and assign a warehouse rack location."],dispatch:["Dispatch transaction & pick list","Enter dispatch requirement and generate a pick list from available stock."],picking:["Picking & dispatch confirmation","Scan picked leathers against the pick list and confirm dispatch."]};
$("title").textContent=names[page][0];$("desc").textContent=names[page][1];stats();let w=$("workspace");
if(page==="qr"){let l=lots.find(x=>x.id===lotId);let found=leather.filter(x=>x.lot===lotId);w.innerHTML=`<h2>1. Generate QR codes by receipt lot</h2><div class="form"><div class="field"><label>Receipt lot / GRN</label><select id="lotSel">${lots.map(x=>`<option value="${x.id}" ${x.id===lotId?"selected":""}>${x.id} · ${x.supplier} · ${x.qty} pcs</option>`).join("")}</select></div><div class="field"><label>Supplier</label><input readonly value="${l.supplier}"></div><div class="field"><label>Article</label><input readonly value="${l.article}"></div><div class="field"><label>Receipt date / Qty</label><input readonly value="${l.date} / ${l.qty} pcs"></div></div><button class="btn primary" id="generate">Generate QR codes for selected lot</button><button class="btn" id="print">Print labels</button><div class="muted" style="margin-top:12px">Each leather receives a unique ID linked to its GRN.</div><div class="qrgrid">${found.slice(0,20).map(x=>`<div class="qr">${qrSvg(x.id)}<b>${x.id}</b><span class="muted">${x.lot}</span></div>`).join("")}</div>`;$("lotSel").onchange=e=>{lotId=e.target.value;render()};$("generate").onclick=()=>{if(l.done){notify("QR codes already generated for this receipt lot");return}for(let i=1;i<=l.qty;i++)leather.push({id:`LEA-${l.id.slice(-5)}-${String(i).padStart(3,"0")}`,lot:l.id,article:l.article,grade:"",location:"",picked:false,done:false});l.done=true;notify(l.qty+" QR codes generated");render()};$("print").onclick=()=>{if(!found.length){notify("Generate QR codes first");return}let win=window.open("","_blank");win.document.write(`<html><body><h2>QR labels ${lotId}</h2><div style="display:grid;grid-template-columns:repeat(4,1fr)">${found.map(x=>`<div style="border:1px solid #aaa;padding:10px;text-align:center">${qrSvg(x.id)}<b style="display:block">${x.id}</b></div>`).join("")}</div><script>window.print()<\/script></body></html>`);win.document.close()}}
if(page==="grade"){w.innerHTML=`<h2>2. Inspection & grade mapping</h2><div class="form"><div class="field"><label>Grade master</label><select id="grade">${grades.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Scan / enter leather QR ID</label><input id="gradeId" placeholder="LEA-26041-001"></div><div class="field"><label>Sq.ft per piece</label><input id="gradeSqft" type="number" min="0.01" step="0.01" placeholder="e.g. 5.25"></div></div><button class="btn primary" id="gradeSave">Save grade & sq.ft for scanned leather</button><div class="tablewrap"><table><thead><tr><th>Leather ID</th><th>GRN</th><th>Article</th><th>Grade</th><th>Sq.ft / piece</th></tr></thead><tbody>${leather.map(x=>`<tr><td>${x.id}</td><td>${x.lot}</td><td>${x.article}</td><td>${x.grade||"Pending"}</td><td>${x.sqft===undefined?"—":Number(x.sqft).toFixed(2)}</td></tr>`).join("")}</tbody></table></div>`;$("gradeSave").onclick=()=>{let x=leather.find(x=>x.id===$("gradeId").value.trim().toUpperCase());if(!x){notify("Leather QR not found");return}if(x.grade){notify("Grade already recorded");return}let sqft=Number($("gradeSqft").value);if(!Number.isFinite(sqft)||sqft<=0){notify("Enter a valid Sq.ft per piece");return}x.grade=$("grade").value.charAt(0);x.sqft=sqft;notify("Grade and sq.ft saved");render()}}
if(page==="putaway"){w.innerHTML=`<h2>3. Put-away scanned leathers</h2><div class="form"><div class="field"><label>Scan leather QR ID</label><input id="putId" placeholder="LEA-26041-001"></div><div class="field"><label>Rack location</label><select id="rack"><option>RACK-A-01-02</option><option>RACK-A-01-03</option><option>RACK-A-02-01</option><option>RACK-B-02-01</option></select></div></div><button class="btn primary" id="putSave">Confirm put-away</button><div class="tablewrap"><table><thead><tr><th>Leather ID</th><th>Grade</th><th>Location</th><th>Status</th></tr></thead><tbody>${leather.map(x=>`<tr><td>${x.id}</td><td>${x.grade||"—"}</td><td>${x.location||"—"}</td><td>${x.location?"Stored":"Awaiting"}</td></tr>`).join("")}</tbody></table></div>`;$("putSave").onclick=()=>{let x=leather.find(x=>x.id===$("putId").value.trim().toUpperCase());if(!x||!x.grade||x.grade==="D"||x.location){notify("Invalid, ungraded, rejected or already stored leather");return}x.location=$("rack").value;notify("Put-away confirmed");render()}}
if(page==="dispatch"){w.innerHTML=`<h2>4. Dispatch transaction & pick list</h2><div class="form"><div class="field"><label>Dispatch reference</label><input id="ref" placeholder="DSP-26091"></div><div class="field"><label>Customer</label><input id="customer" placeholder="Customer name"></div><div class="field"><label>Article</label><select id="article"><option value="">All articles</option>${[...new Set(leather.map(x=>x.article))].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Grade</label><select id="dispatchGrade"><option value="">Any grade</option>${grades.slice(0,3).map(x=>`<option value="${x[0]}">${x}</option>`).join("")}</select></div><div class="field"><label>Required quantity</label><input type="number" min="1" id="qty"></div></div><button class="btn primary" id="makePick">Generate pick list</button><div class="tablewrap"><table><thead><tr><th>Pick list</th><th>Dispatch ref</th><th>Customer</th><th>Qty</th><th>Status</th></tr></thead><tbody>${picklists.map(x=>`<tr><td>${x.id}</td><td>${x.ref}</td><td>${x.customer}</td><td>${x.items.length}</td><td>${x.done?"Dispatched":"Open"}</td></tr>`).join("")}</tbody></table></div>`;$("makePick").onclick=()=>{let qty=Number($("qty").value),available=leather.filter(x=>x.location&&!x.picked&&!x.done&&(!$("article").value||x.article===$("article").value)&&(!$("dispatchGrade").value||x.grade===$("dispatchGrade").value));if(!$("ref").value||!$("customer").value||qty<1){notify("Enter dispatch, customer and quantity");return}if(available.length<qty){notify("Insufficient stock. Available: "+available.length);return}let pl={id:"PL-"+(1001+picklists.length),ref:$("ref").value,customer:$("customer").value,items:available.slice(0,qty),done:false};picklists.push(pl);selectedPick=pl.id;page="picking";render();notify("Pick list generated")}}
if(page==="picking"){let pl=picklists.find(x=>x.id===selectedPick&&!x.done);w.innerHTML=`<h2>5. Picking & dispatch confirmation</h2><div class="field"><label>Pick list</label><select id="pickSel"><option value="">Select pick list</option>${picklists.filter(x=>!x.done).map(x=>`<option value="${x.id}" ${x.id===selectedPick?"selected":""}>${x.id} · ${x.ref} · ${x.items.length} pcs</option>`).join("")}</select></div>${pl?`<p class="muted">${pl.customer} · ${pl.items.filter(x=>x.picked).length} of ${pl.items.length} picked</p><div class="field"><label>Scan leather QR ID</label><input id="pickId" placeholder="Scan allocated leather ID"></div><button class="btn primary" id="pickSave">Verify & pick</button><div class="tablewrap"><table><thead><tr><th>Leather ID</th><th>Rack location</th><th>Grade</th><th>Pick status</th></tr></thead><tbody>${pl.items.map(x=>`<tr><td>${x.id}</td><td>${x.location}</td><td>${x.grade}</td><td>${x.picked?"Picked":"Pending"}</td></tr>`).join("")}</tbody></table></div><button class="btn success" id="dispatchConfirm" ${pl.items.some(x=>!x.picked)?"disabled":""}>Confirm dispatch</button>`:`<p class="muted">Choose an open pick list. Generate one from the Dispatch / pick list screen after put-away stock is available.</p>`}`;if($("pickSel"))$("pickSel").onchange=e=>{selectedPick=e.target.value;render()};if(pl){$("pickSave").onclick=()=>{let x=pl.items.find(x=>x.id===$("pickId").value.trim().toUpperCase());if(!x){notify("Scanned leather is not on this pick list");return}if(x.picked){notify("Already picked");return}x.picked=true;render()};if($("dispatchConfirm"))$("dispatchConfirm").onclick=()=>{if(pl.items.some(x=>!x.picked))return;pl.done=true;pl.items.forEach(x=>x.done=true);notify("Dispatch confirmed");render()}}}
}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;render()}));
render();
})();
</script></body></html>
